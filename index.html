<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر القوة الخفية (AR)</title>
<!-- مكتبات مفتوحة المصدر من GitHub: A-Frame و AR.js (تتبع البطاقات المطبوعة بالكاميرا) -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:Tahoma,"Segoe UI",sans-serif}
  #hud{position:fixed;inset-inline:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
       display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  #status{background:rgba(255,255,255,.92);color:#1E2A2F;border-radius:14px;padding:10px 16px;font-size:18px;font-weight:bold;
          text-align:center;max-width:560px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #status.att{background:#2E9D62;color:#fff} #status.rep{background:#7C4DCC;color:#fff}
  #why{background:rgba(0,0,0,.6);color:#fff;border-radius:10px;padding:6px 12px;font-size:15px;text-align:center;max-width:560px}
  #why[hidden]{display:none}
  #bar{position:fixed;inset-inline:0;bottom:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
       padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
  #bar button{font:bold 16px Tahoma,sans-serif;border:0;border-radius:12px;padding:12px 16px;background:#fff;color:#1E2A2F;min-height:46px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #bar button[aria-pressed="true"]{background:#0F7C74;color:#fff}
  #start{position:fixed;inset:0;z-index:20;background:#0F7C74;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  #start[hidden]{display:none}
  #start h1{margin:0;font-size:28px} #start p{margin:0;max-width:460px;line-height:1.7;font-size:17px}
  #start button{font:bold 20px Tahoma,sans-serif;border:0;border-radius:14px;padding:14px 28px;background:#fff;color:#0F7C74}
</style>
</head>
<body>

<div id="start">
  <h1>مختبر القوة الخفية</h1>
  <p>ضع بطاقة المغناطيس (أ) وبطاقة المغناطيس (ب) على الطاولة، ثم وجّه كاميرا الجهاز إليهما. قرّب البطاقتين من بعضهما، واقلب إحداهما لترى ماذا يحدث.</p>
  <button id="go">ابدأ</button>
</div>

<div id="hud">
  <div id="status">وجّه الكاميرا إلى البطاقتين</div>
  <div id="why" hidden></div>
</div>
<div id="bar">
  <button id="field" aria-pressed="false">أظهر القوة الخفية</button>
  <button id="sound" aria-pressed="true">الصوت: يعمل</button>
</div>

<a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true; colorManagement:true"
         arjs="sourceType:webcam; debugUIEnabled:false;" magnet-lab>
  <!-- البطاقة (أ) = حرف A ، البطاقة (ب) = حرف B (ملفات النمط داخل المشروع). المحور x لكل بطاقة هو اتجاه القطب الشمالي -->
  <a-marker type="pattern" url="pattern-A.patt" id="mA" smooth="true" smoothCount="6" smoothTolerance="0.01" smoothThreshold="2">
    <a-entity magnet="label: A"></a-entity>
  </a-marker>
  <a-marker type="pattern" url="pattern-B.patt" id="mB" smooth="true" smoothCount="6" smoothTolerance="0.01" smoothThreshold="2">
    <a-entity magnet="label: B"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<script>
/* ---------- مغناطيس ثلاثي الأبعاد فوق كل بطاقة ---------- */
AFRAME.registerComponent('magnet', {
  schema: { label: { default: '' } },
  init() {
    const el = this.el;
    // جسم المغناطيس: نصف أحمر (N = ش) على +x ونصف أزرق (S = ج) على -x
    el.insertAdjacentHTML('beforeend', `
      <a-box position="0.45 0.15 0" width="0.9" height="0.3" depth="0.45" color="#D64541"></a-box>
      <a-box position="-0.45 0.15 0" width="0.9" height="0.3" depth="0.45" color="#2F6FD6"></a-box>
      <a-text value="N" position="0.45 0.31 0" rotation="-90 0 0" align="center" width="5" color="#fff"></a-text>
      <a-text value="S" position="-0.45 0.31 0" rotation="-90 0 0" align="center" width="5" color="#fff"></a-text>
      <a-text value="${this.data.label}" position="0 0.31 0.36" rotation="-90 0 0" align="center" width="4" color="#1E2A2F"></a-text>
      <a-entity class="field" visible="false"></a-entity>`);
    // خطوط المجال: منحنيات ثنائي القطب r = k·sin²θ تخرج من الشمالي (+x) وتدخل الجنوبي (-x)
    const f = el.querySelector('.field');
    const build = () => {
      const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
      [1.3, 1.8, 2.4, 3.1].forEach(k => {
        [1, -1].forEach(side => {
          const pts = [];
          for (let i = 1; i < 120; i++) {
            const th = i / 120 * Math.PI, r = k * Math.sin(th) ** 2;
            const x = r * Math.cos(th), z = side * r * Math.sin(th);
            if (Math.abs(x) < 0.92 && Math.abs(z) < 0.26) continue;
            pts.push(new THREE.Vector3(x, 0.15, z));
          }
          f.object3D.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
        });
      });
    };
    if (f.hasLoaded) build(); else f.addEventListener('loaded', build);
  }
});

/* ---------- منطق التجاذب والتنافر بين البطاقتين ---------- */
AFRAME.registerComponent('magnet-lab', {
  init() {
    this.A = document.getElementById('mA');
    this.B = document.getElementById('mB');
    this.status = document.getElementById('status');
    this.why = document.getElementById('why');
    this.last = null; this.soundOn = true; this.audio = null;
    this.pA = new THREE.Vector3(); this.pB = new THREE.Vector3();
    this.qA = new THREE.Quaternion(); this.qB = new THREE.Quaternion();
    this.xA = new THREE.Vector3(); this.xB = new THREE.Vector3(); this.d = new THREE.Vector3();
    this.up = new THREE.Vector3(0, 1, 0);

    // سهما القوة بين المغناطيسين: يُنشآن مرة واحدة ويُحرَّكان في كل إطار
    this.link = document.createElement('a-entity');
    this.link.setAttribute('visible', false);
    this.cones = [0, 1].map(() => {
      const c = document.createElement('a-cone');
      c.setAttribute('radius-bottom', 0.14); c.setAttribute('radius-top', 0.001);
      c.setAttribute('height', 0.4); c.setAttribute('color', '#2E9D62');
      this.link.appendChild(c); return c;
    });
    this.el.appendChild(this.link);
    this.color = '#2E9D62';

    document.getElementById('field').onclick = (e) => {
      const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
      e.currentTarget.setAttribute('aria-pressed', on);
      e.currentTarget.textContent = on ? 'أخفِ القوة الخفية' : 'أظهر القوة الخفية';
      document.querySelectorAll('.field').forEach(f => f.setAttribute('visible', on));
    };
    document.getElementById('sound').onclick = (e) => {
      this.soundOn = !this.soundOn;
      e.currentTarget.setAttribute('aria-pressed', this.soundOn);
      e.currentTarget.textContent = this.soundOn ? 'الصوت: يعمل' : 'الصوت: متوقف';
    };
    document.getElementById('go').onclick = () => {
      document.getElementById('start').hidden = true;
      try { this.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    };
  },
  beep(kind) {
    if (!this.soundOn || !this.audio) return;
    const a = this.audio, o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.connect(g); g.connect(a.destination);
    if (kind === 'att') {
      o.type = 'square'; o.frequency.setValueAtTime(900, t);
      g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + .1); o.start(t); o.stop(t + .12);
    } else {
      o.type = 'sine'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(520, t + .25); o.frequency.exponentialRampToValueAtTime(240, t + .45);
      g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .5); o.start(t); o.stop(t + .5);
    }
  },
  say(state, main, why) {
    this.status.className = state || '';
    this.status.textContent = main;
    this.why.hidden = !why; this.why.textContent = why || '';
  },
  tick() {
    const A = this.A, B = this.B;
    const seeA = A.object3D.visible, seeB = B.object3D.visible;
    if (!seeA || !seeB) {
      this.link.setAttribute('visible', false);
      const k = 'none' + seeA + seeB;
      if (this.last !== k) {
        this.last = k;
        this.say('', !seeA && !seeB ? 'وجّه الكاميرا إلى البطاقتين'
          : (seeA ? 'أرى المغناطيس (أ). أين المغناطيس (ب)؟' : 'أرى المغناطيس (ب). أين المغناطيس (أ)؟'));
      }
      return;
    }
    A.object3D.getWorldPosition(this.pA); B.object3D.getWorldPosition(this.pB);
    A.object3D.getWorldQuaternion(this.qA); B.object3D.getWorldQuaternion(this.qB);
    this.xA.set(1, 0, 0).applyQuaternion(this.qA); // اتجاه القطب الشمالي للمغناطيس (أ)
    this.xB.set(1, 0, 0).applyQuaternion(this.qB); // اتجاه القطب الشمالي للمغناطيس (ب)
    this.d.subVectors(this.pB, this.pA);
    const dist = this.d.length(); this.d.normalize();
    // أي قطب من (أ) يواجه (ب)؟ وأي قطب من (ب) يواجه (أ)؟
    const faceA = this.xA.dot(this.d) > 0 ? 'N' : 'S';
    const faceB = this.xB.dot(this.d) < 0 ? 'N' : 'S';
    if (dist > 4.5) { // المسافة بوحدة عرض البطاقة تقريبًا
      this.link.setAttribute('visible', false);
      if (this.last !== 'far') { this.last = 'far'; this.say('', 'قرّب البطاقتين من بعضهما', 'ماذا تتوقع؟ تجاذب أم تنافر؟'); }
      return;
    }
    const attract = faceA !== faceB;
    const key = attract ? 'att' : 'rep';
    this.drawLink(attract);
    if (this.last !== key) {
      this.last = key; this.beep(key);
      const ar = p => p === 'N' ? 'الشمالي (ش)' : 'الجنوبي (ج)';
      this.say(key, attract ? 'تجاذب: المغناطيسان يسحبان بعضهما' : 'تنافر: المغناطيسان يدفعان بعضهما',
        `القطب ${ar(faceA)} من (أ) يقابل القطب ${ar(faceB)} من (ب)، و${attract ? 'القطبان المختلفان يتجاذبان' : 'القطبان المتشابهان يتنافران'}.`);
    }
  },
  drawLink(attract) {
    // سهمان في منتصف المسافة: يتجهان نحو بعضهما (تجاذب) أو بعيدًا عن بعضهما (تنافر)
    const mid = new THREE.Vector3().addVectors(this.pA, this.pB).multiplyScalar(0.5);
    const color = attract ? '#2E9D62' : '#7C4DCC';
    [[-1, this.cones[0]], [1, this.cones[1]]].forEach(([side, cone]) => {
      const pos = mid.clone().addScaledVector(this.d, side * 0.45);
      cone.object3D.position.copy(pos);
      cone.object3D.position.y += 0.4;
      const dir = this.d.clone().multiplyScalar(attract ? -side : side);
      cone.object3D.quaternion.setFromUnitVectors(this.up, dir);
    });
    if (this.color !== color) { this.color = color; this.cones.forEach(c => c.setAttribute('color', color)); }
    this.link.setAttribute('visible', true);
  }
});
</script>
</body>
</html>
